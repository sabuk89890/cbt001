name: "Auto deploy to Vercel"

on:
  push:
    # run on any branch so deployment triggers on every push
    branches:
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # make sure node is available for the vercel CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Debug Vercel env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID"
          echo "VERCEL_ORG_ID: (removed from runner to let CLI infer org)"
          echo -n "VERCEL_TOKEN length: "
          echo -n "$VERCEL_TOKEN" | wc -c
          echo "---- vercel whoami ----"
          npx vercel whoami --token "$VERCEL_TOKEN" || true
          echo "---- vercel projects ls ----"
          npx vercel projects ls --token "$VERCEL_TOKEN" || true
          echo "---- vercel projects inspect ----"
          npx vercel projects inspect "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" || true

      # deploy with vercel CLI using a token stored in Secrets
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # non-interactive deploy; pass token explicitly so CLI can infer org
          npx vercel --prod --yes --token "$VERCEL_TOKEN"
